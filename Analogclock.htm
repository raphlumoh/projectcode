-<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="analogclock.css" />
    <title>Clock</title>
  </head>
  <style>
  body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #222;
}
.brand {
  position: absolute;
  top: 62%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  font-family: Arial, sans-serif;
  letter-spacing: 2px;
  z-index: 2;
 /* text-shadow: 0 0 8px #0f0;*/
}
.clock {
  width: 300px;
  height: 300px;
  border: 10px solid #0f0;
  border-radius: 50%;
  position: relative;
  background: #000;
}

.numbers div {
  position: absolute;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
}

.twelve { top: 10px; left: 50%; transform: translateX(-50%); }
.three  { right: 10px; top: 50%; transform: translateY(-50%); }
.six    { bottom: 10px; left: 50%; transform: translateX(-50%); }
.nine   { left: 10px; top: 50%; transform: translateY(-50%); }

.arrows div {
  position: absolute;
  background: #fff;
  transform-origin: bottom center;
  left: 50%;
  top: 50%;
}

.hour {
  width: 8px;
  height: 70px;
  background: #f00;
  transform: translateX(-50%) translateY(-100%) rotate(90deg);
}

.minute {
  width: 5px;
  height: 100px;
  background: #0f0;
  transform: translateX(-50%) translateY(-100%) rotate(90deg);
}

.second {
  width: 2px;
  height: 120px;
  background: #0ff;
  transform: translateX(-50%) translateY(-100%) rotate(90deg);
}
.clock::after {
  content: "";
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
}
/* Center dot 
.clock::after {
  content: "";
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
	  */

  </style>
  <body>
    <div class="clock">
      <div class="numbers">
        <div class="twelve">12</div>
        <div class="three">3</div>
        <div class="six">6</div>
        <div class="nine">9</div>
      </div>
		
      <div class="brand">Grace</div>

		
      <div class="arrows">
        <div class="hour"></div>
        <div class="minute"></div>
        <div class="second"></div>
      </div>
      <img src="old school.jpg" alt=""  />
    </div>
    <script>
    const secondHand = document.querySelector(".second");
	const minuteHand = document.querySelector(".minute");
	const hourHand = document.querySelector(".hour");

function updateClock() {
  const now = new Date();

  const seconds = now.getSeconds();
  const minutes = now.getMinutes();
  const hours = now.getHours() % 12;

  const secondDeg = seconds * 6; 	//360/60
  const minuteDeg = minutes * 6 + seconds * 0.1;	//60*6
  const hourDeg = hours * 30 + minutes * 0.5;

  secondHand.style.transform =
  `translateX(-50%) translateY(-100%) rotate(${secondDeg}deg)`;
  minuteHand.style.transform =
    `translateX(-50%) translateY(-100%) rotate(${minuteDeg}deg)`;

  hourHand.style.transform =
    `translateX(-50%) translateY(-100%) rotate(${hourDeg}deg)`;
}

setInterval(updateClock, 1000);
updateClock();

</script>
  </body>
</html>
