<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Calculator</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;

}

.container{

    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);

}

h1{

    text-align:center;
    margin-bottom:20px;

}
.invoice-text{
    color: #d32f2f;
    font-weight: bold;
}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#0077cc;
    color:white;
    padding:12px;

}

td{

    border-bottom:1px solid #ddd;
    padding:10px;

}

input{

    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;

}

button{

    cursor:pointer;
    border:none;
    padding:10px 18px;
    border-radius:5px;

}

#addRow{

    margin-top:20px;
    background:#28a745;
    color:white;

}

.delete{

    background:red;
    color:white;

}

.summary{

    margin-top:30px;
    max-width:350px;
    margin-left:auto;

}

.summary input{

    margin-bottom:15px;

}

.summary h2{

    color:#0077cc;
}

.summary h3{

    margin:12px 0;

}

@media(max-width:700px){

table{

display:block;
overflow:auto;

}

}
.invoice-info{

display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;

}

.invoice-info div{

flex:1;

}

.invoice-info label{

display:block;
margin-bottom:5px;
font-weight:bold;

}

.invoice-info input{

background:#f7f7f7;

}

.buttons{

display:flex;
gap:15px;
margin-top:20px;

}

#printBill{

background:#0d6efd;
color:white;

}

@media(max-width:700px){

.invoice-info{

flex-direction:column;

}

.buttons{

flex-direction:column;

}

}
/*
Hide Buttons When Printing
@media print{

#addRow,
#printBill,
.delete{

display:none;

}

body{

background:white;

}

.container{

box-shadow:none;

width:100%;

}

}
/*
</style>
</head>
<body>

<div class="container">

   <h1>
    🧾 Raph Super Market<br>
    <span class="invoice-text">Invoice</span>
</h1>

    <div>
        <label>Invoice No.</label>
        <input type="text" id="invoiceNo" readonly>
    </div>

    <div>
        <label>Date</label>
        <input type="text" id="invoiceDate" readonly>
    </div>

    <div>
        <label>Time</label>
        <input type="text" id="invoiceTime" readonly>
    </div>

</div>

    <table id="billTable">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th></th>
            </tr>
        </thead>

        <tbody id="tbody">

            <tr>
                <td><input type="text" placeholder="Item Name"></td>

                <td>
                    <input type="number" class="price" min="0">
                </td>

                <td>
                    <input type="number" class="qty" min="1" value="1">
                </td>

                <td class="lineTotal">0.00</td>

                <td>
                    <button class="delete">❌</button>
                </td>
            </tr>

        </tbody>

    </table>

    <button id="addRow">➕ Add Item</button>
    <div class="buttons">

    <button id="printBill">
        🖨 Print Bill
    </button>

</div>

    <div class="summary">

        <label>Discount (%)</label>
        <input type="number" id="discount" value="0">

        <label>Tax (%)</label>
        <input type="number" id="tax" value="0">

        <hr>

        <h3>Subtotal :
            <span id="subtotal">0.00</span>
        </h3>

        <h3>Discount :
            <span id="discountValue">0.00</span>
        </h3>

        <h3>Tax :
            <span id="taxValue">0.00</span>
        </h3>

        <h2>Grand Total :
            <span id="grandTotal">0.00</span>
        </h2>

    </div>

</div>

<script>
//invoice number
function generateInvoice(){

const invoice =
"INV-" +
Math.floor(100000 + Math.random()*900000);

document.getElementById("invoiceNo").value=invoice;

}

generateInvoice();
//invoice number end here
function setDate(){

const today=new Date();

document.getElementById("invoiceDate").value=
today.toLocaleDateString();

}

setDate();

//date end here
function updateTime(){

const now=new Date();

document.getElementById("invoiceTime").value=
now.toLocaleTimeString();

}

updateTime();

setInterval(updateTime,1000);
//time end here
document.getElementById("printBill").addEventListener("click",()=>{

window.print();

});
//print bill end here
const tbody=document.getElementById("tbody");

const addBtn=document.getElementById("addRow");

const subtotal=document.getElementById("subtotal");

const grand=document.getElementById("grandTotal");

const discount=document.getElementById("discount");

const tax=document.getElementById("tax");

const discountValue=document.getElementById("discountValue");

const taxValue=document.getElementById("taxValue");

function money(value){

return Number(value).toLocaleString(undefined,{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}

function calculate(){

let sub=0;

document.querySelectorAll("#tbody tr").forEach(row=>{

let price=Number(row.querySelector(".price").value)||0;

let qty=Number(row.querySelector(".qty").value)||0;

let total=price*qty;

row.querySelector(".lineTotal").textContent=money(total);

sub+=total;

});

let dis=sub*(Number(discount.value)/100);

let taxable=sub-dis;

let taxAmt=taxable*(Number(tax.value)/100);

let grandTotal=taxable+taxAmt;

subtotal.textContent=money(sub);

discountValue.textContent=money(dis);

taxValue.textContent=money(taxAmt);

grand.textContent=money(grandTotal);

}

function events(row){

row.querySelector(".price").addEventListener("input",calculate);

row.querySelector(".qty").addEventListener("input",calculate);

row.querySelector(".delete").addEventListener("click",()=>{

if(document.querySelectorAll("#tbody tr").length>1){

row.remove();

calculate();

}

});

}

events(document.querySelector("#tbody tr"));

addBtn.onclick=()=>{

let row=document.createElement("tr");

row.innerHTML=`

<td><input type="text" placeholder="Item Name"></td>

<td><input type="number" class="price" min="0"></td>

<td><input type="number" class="qty" min="1" value="1"></td>

<td class="lineTotal">0.00</td>

<td><button class="delete">❌</button></td>

`;

tbody.appendChild(row);

events(row);

};

discount.addEventListener("input",calculate);

tax.addEventListener("input",calculate);

calculate();
</script>

</body>
</html>
