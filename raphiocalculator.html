<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Raph Advanced Calculator</title>
    <style>

        /* ================================
           GENERAL PAGE
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;
            background: #1f2f2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* ================================    CALCULATOR       ================================= */

        .calculator {
            background: #1f2d51;
            width: 330px;
            padding: 20px;
            border-radius: 20px;
            border: 8px solid #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            text-align: center;
        }

        /* ================================   DISPLAY     ================================= */

        .display-box {
            background: #eff2e6;
            border: 5px solid #cccccc;
            border-radius: 15px;
            width: 100%;
            min-height: 90px;
            padding: 8px 10px;
            margin-bottom: 10px;
            text-align: right;
            overflow: hidden;
        }

        .memory {
            height: 18px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            text-align: left;
        }


        .previous {
            min-height: 20px;
            font-size: 16px;
            font-weight: bold;
            color: brown;
        }

        .current {
            min-height: 35px;
            font-size: 25px;
            font-weight: bold;
            color: black;
            white-space: nowrap;
            overflow-x: auto;
        }

        /* ================================     BUTTON ROW        ================================= */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        /* ================================
           NORMAL BUTTON
        ================================= */

        button {
            width: 60px;
            height: 55px;
            margin: 3px;
            border: none;
            border-radius: 8px;
            background: teal;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: darkcyan;
            transform: scale(1.05);
        }


        button:active {
            transform: scale(0.95);
        }


        /* ================================           FUNCTION BUTTONS        ================================= */

        .brown {
            background: orange;
            color: black;
            font-size: 19px;
        }

        .brown:hover {
            background: darkorange;
        }
        /* ================================           EQUAL BUTTON        ================================= */
        .equal {
            background: #ff8c00;
        }

        .equal:hover {
            background: darkorange;
        }


        /* ================================
           MEMORY BUTTONS
        ================================= */

        .memory-button {

            background: #455a64;

            font-size: 14px;

        }


        .memory-button:hover {

            background: #607d8b;

        }


        /* ================================
           RAPH BUTTON
        ================================= */

        .raph {

            background: #8a2be2;

            color: white;

            font-size: 16px;

        }


        .raph:hover {

            background: #6a1bb1;

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 400px) {

            body {

                padding: 10px;

            }


            .calculator {

                width: 100%;

                padding: 12px;

            }


            button {

                width: 55px;

                height: 52px;

            }


            .current {

                font-size: 22px;

            }

        }

    </style>

</head>



<body>


    <!-- =================================
         CALCULATOR
    ================================== -->

    <div class="calculator">


        <!-- =================================
             DISPLAY
        ================================== -->

        <div class="display-box">


            <!-- Memory indicator -->

            <div id="memory"
                 class="memory">
            </div>


            <!-- Previous calculation -->

            <div id="previous"
                 class="previous">
            </div>


            <!-- Current number -->

            <div id="current"
                 class="current">
            </div>


        </div>



        <!-- =================================
             MEMORY BUTTONS
        ================================== -->

        <div class="button-row">

            <button
                class="memory-button"
                onclick="memoryClear()">

                MC

            </button>


            <button
                class="memory-button"
                onclick="memoryRecall()">

                MR

            </button>


            <button
                class="memory-button"
                onclick="memoryAdd()">

                M+

            </button>


            <button
                class="memory-button"
                onclick="memorySubtract()">

                M−

            </button>

        </div>



        <!-- =================================
             CLEAR / DELETE / PERCENT / DIVIDE
        ================================== -->

        <div class="button-row">

            <button
                class="brown"
                onclick="clearDisplay()">

                C

            </button>


            <button
                class="brown"
                onclick="deleteChar()">

                ⌫

            </button>


            <button
                class="brown"
                onclick="percent()">

                %

            </button>


            <button
                class="brown"
                onclick="append('/')">

                ÷

            </button>

        </div>



        <!-- =================================
             ROOT / SQUARE / RECIPROCAL / MULTIPLY
        ================================== -->

        <div class="button-row">

            <button
                class="brown"
                onclick="squareRoot()">

                √

            </button>


            <button
                class="brown"
                onclick="square()">

                x²

            </button>


            <button
                class="brown"
                onclick="reciprocal()">

                1/x

            </button>


            <button
                class="brown"
                onclick="append('*')">

                ×

            </button>

        </div>



        <!-- =================================
             7 8 9 -
        ================================== -->

        <div class="button-row">

            <button onclick="append('7')">

                7

            </button>


            <button onclick="append('8')">

                8

            </button>


            <button onclick="append('9')">

                9

            </button>


            <button
                class="brown"
                onclick="append('-')">

                −

            </button>

        </div>



        <!-- =================================
             4 5 6 +
        ================================== -->

        <div class="button-row">

            <button onclick="append('4')">

                4

            </button>


            <button onclick="append('5')">

                5

            </button>


            <button onclick="append('6')">

                6

            </button>


            <button
                class="brown"
                onclick="append('+')">

                +

            </button>

        </div>



        <!-- =================================
             1 2 3 =
        ================================== -->

        <div class="button-row">

            <button onclick="append('1')">

                1

            </button>


            <button onclick="append('2')">

                2

            </button>


            <button onclick="append('3')">

                3

            </button>


            <button
                class="equal"
                onclick="calculate()">

                =

            </button>

        </div>



        <!-- =================================
             0 . +/- RAPH
        ================================== -->

        <div class="button-row">

            <button onclick="append('0')">

                0

            </button>


            <button onclick="append('.')">

                .

            </button>


            <button onclick="toggleSign()">

                ±

            </button>


            <button
                class="raph"
                onclick="raphMessage()">

                Raph

            </button>

        </div>


    </div>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>


        /* =================================
           GET DISPLAY ELEMENTS
        ================================= */

        const previousDisplay =
            document.getElementById("previous");


        const currentDisplay =
            document.getElementById("current");


        const memoryDisplay =
            document.getElementById("memory");



        /* =================================
           VARIABLES
        ================================= */

        let currentInput = "";

        let previousInput = "";

        let memory = 0;



        /* =================================
           UPDATE DISPLAY
        ================================= */

        function updateDisplay() {

            currentDisplay.textContent =
                currentInput;


            previousDisplay.textContent =
                previousInput;

        }



        /* =================================
           ADD NUMBER / OPERATOR
        ================================= */

        function append(value) {


            const operators =
                "+-*/";


            /*
               Prevent invalid operators.
            */

            if (operators.includes(value)) {


                /*
                   If the calculator is empty,
                   only minus is allowed first.
                */

                if (currentInput === "") {

                    if (value !== "-") {

                        return;

                    }

                }


                /*
                   Prevent:

                   5++
                   5+*
                   5--
                   etc.
                */

                const lastCharacter =
                    currentInput.slice(-1);


                if (
                    operators.includes(lastCharacter)
                ) {

                    currentInput =
                        currentInput.slice(0, -1);

                }

            }



            /*
               Prevent multiple decimal points
               in the same number.
            */

            if (value === ".") {


                const lastNumber =
                    currentInput
                    .split(/[+\-*/]/)
                    .pop();


                if (
                    lastNumber.includes(".")
                ) {

                    return;

                }

            }



            currentInput += value;


            updateDisplay();

        }



        /* =================================
           CLEAR CALCULATOR
        ================================== */

        function clearDisplay() {

            currentInput = "";

            previousInput = "";

            updateDisplay();

        }



        /* =================================
           DELETE LAST CHARACTER
        ================================== */

        function deleteChar() {

            currentInput =
                currentInput.slice(0, -1);


            updateDisplay();

        }



        /* =================================
           CALCULATE
        ================================== */

        function calculate() {


            if (currentInput === "") {

                return;

            }


            try {


                const result =
                    eval(currentInput);


                /*
                   Check for Infinity
                   and NaN.
                */

                if (
                    !Number.isFinite(result)
                ) {

                    throw new Error();

                }


                previousInput =
                    currentInput + " =";


                currentInput =
                    result.toString();


                updateDisplay();

            }


            catch {


                previousInput =
                    currentInput;


                currentInput =
                    "Error";


                updateDisplay();

            }

        }



        /* =================================
           SQUARE
        ================================== */

        function square() {


            if (currentInput === "") {

                return;

            }


            try {


                const number =
                    eval(currentInput);


                const result =
                    Math.pow(number, 2);


                previousInput =
                    currentInput + "² =";


                currentInput =
                    result.toString();


                updateDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           SQUARE ROOT
        ================================== */

        function squareRoot() {


            if (currentInput === "") {

                return;

            }


            try {


                const number =
                    eval(currentInput);


                /*
                   Square root of a negative
                   number is not supported.
                */

                if (number < 0) {

                    showError();

                    return;

                }


                const result =
                    Math.sqrt(number);


                previousInput =
                    "√(" +
                    currentInput +
                    ") =";


                currentInput =
                    result.toString();


                updateDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           RECIPROCAL
        ================================== */

        function reciprocal() {


            if (currentInput === "") {

                return;

            }


            try {


                const number =
                    eval(currentInput);


                /*
                   Cannot divide by zero.
                */

                if (number === 0) {

                    showError();

                    return;

                }


                const result =
                    1 / number;


                previousInput =
                    "1/(" +
                    currentInput +
                    ") =";


                currentInput =
                    result.toString();


                updateDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           PERCENTAGE
        ================================== */

        function percent() {


            if (currentInput === "") {

                return;

            }


            try {


                const number =
                    eval(currentInput);


                const result =
                    number / 100;


                previousInput =
                    currentInput + "% =";


                currentInput =
                    result.toString();


                updateDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           POSITIVE / NEGATIVE
        ================================== */

        function toggleSign() {


            if (currentInput === "") {

                return;

            }


            /*
               Only change sign if
               current input is a number.
            */

            if (!isNaN(currentInput)) {


                if (
                    currentInput.startsWith("-")
                ) {

                    currentInput =
                        currentInput.substring(1);

                }


                else {

                    currentInput =
                        "-" + currentInput;

                }

            }


            updateDisplay();

        }



        /* =================================
           ERROR MESSAGE
        ================================== */

        function showError() {


            previousInput =
                currentInput;


            currentInput =
                "Error";


            updateDisplay();

        }



        /* =================================
           MEMORY CLEAR - MC
        ================================== */

        function memoryClear() {


            memory = 0;


            updateMemoryDisplay();

        }



        /* =================================
           MEMORY RECALL - MR
        ================================== */

        function memoryRecall() {


            currentInput =
                memory.toString();


            updateDisplay();

        }



        /* =================================
           MEMORY ADD - M+
        ================================== */

        function memoryAdd() {


            if (currentInput === "") {

                return;

            }


            try {


                memory +=
                    eval(currentInput);


                updateMemoryDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           MEMORY SUBTRACT - M-
        ================================== */

        function memorySubtract() {


            if (currentInput === "") {

                return;

            }


            try {


                memory -=
                    eval(currentInput);


                updateMemoryDisplay();

            }


            catch {

                showError();

            }

        }



        /* =================================
           MEMORY DISPLAY
        ================================== */

        function updateMemoryDisplay() {


            if (memory !== 0) {


                memoryDisplay.textContent =
                    "M: " + memory;

            }


            else {


                memoryDisplay.textContent =
                    "";

            }

        }



        /* =================================
           RAPH BUTTON
        ================================== */

        function raphMessage() {


            previousInput =
                "Calculator by";


            currentInput =
                "Raph";


            updateDisplay();

        }



        /* =================================
           KEYBOARD SUPPORT
        ================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                const key =
                    event.key;



                /*
                   Numbers
                   and operators.
                */

                if (
                    !isNaN(key) ||
                    "+-*/.".includes(key)
                ) {


                    append(key);

                }



                /*
                   Enter
                   or =
                */

                else if (
                    key === "Enter" ||
                    key === "="
                ) {


                    calculate();

                }



                /*
                   Backspace
                */

                else if (
                    key === "Backspace"
                ) {


                    deleteChar();

                }

                /*          Escape         */

                else if (
                    key === "Escape"
                ) {

                    clearDisplay();
                }

                /*   Percentage       */
                else if (
                    key === "%"
                ) {
                    percent();
                }
            }
        );


    </script>
</body>

</html>
